<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MelodyClaw - 歌声小龙虾</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- 主舞台 -->
        <div class="stage">
            <!-- 歌词显示区域 -->
            <div class="lyrics-container" id="lyricsContainer">
                <div class="lyrics-scroll" id="lyricsScroll">
                    <!-- 歌词动态生成 -->
                </div>
            </div>
            
            <!-- 小龙虾动画区域 -->
            <div class="lobster-stage" id="lobsterStage">
                <div class="lobster" id="lobster">
                    <!-- 小龙虾 SVG 动画 -->
                    <svg class="lobster-svg" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg">
                        <!-- 身体 -->
                        <g class="lobster-body" id="lobsterBody">
                            <!-- 尾部 -->
                            <path class="tail" d="M20,80 Q10,80 5,90 Q0,100 10,110 Q20,120 30,115 Q40,110 45,100 Q50,90 45,80 Q40,70 30,70 Q20,70 20,80" fill="#E53935"/>
                            <path class="tail-segment" d="M40,85 Q35,90 38,100 Q40,110 50,108 Q55,100 52,90 Q50,82 40,85" fill="#C62828"/>
                            
                            <!-- 主体 -->
                            <ellipse class="body-main" cx="100" cy="80" rx="55" ry="35" fill="#E53935"/>
                            <ellipse class="body-highlight" cx="95" cy="70" rx="35" ry="20" fill="#EF5350" opacity="0.6"/>
                            
                            <!-- 头部 -->
                            <path class="head" d="M150,80 Q170,75 180,80 Q190,85 185,95 Q180,105 170,105 Q160,105 155,95 Q150,85 150,80" fill="#E53935"/>
                        </g>
                        
                        <!-- 眼睛 -->
                        <g class="lobster-eyes" id="lobsterEyes">
                            <circle class="eye-stalk-left" cx="165" cy="60" r="8" fill="#C62828"/>
                            <circle class="eye-stalk-right" cx="175" cy="60" r="8" fill="#C62828"/>
                            <circle class="eye-left" cx="165" cy="55" r="5" fill="#FFF"/>
                            <circle class="eye-right" cx="175" cy="55" r="5" fill="#FFF"/>
                            <circle class="pupil-left" cx="166" cy="54" r="2" fill="#000"/>
                            <circle class="pupil-right" cx="176" cy="54" r="2" fill="#000"/>
                        </g>
                        
                        <!-- 钳子 -->
                        <g class="lobster-claws" id="lobsterClaws">
                            <!-- 左钳 -->
                            <g class="claw-left" id="clawLeft">
                                <path d="M145,70 Q155,60 165,55 Q175,50 180,55 Q185,60 180,70 Q175,80 165,85 Q155,85 150,80 Q145,75 145,70" fill="#E53935"/>
                                <path d="M175,58 Q178,60 176,65" stroke="#C62828" stroke-width="2" fill="none"/>
                            </g>
                            <!-- 右钳 -->
                            <g class="claw-right" id="clawRight">
                                <path d="M145,90 Q155,100 165,105 Q175,110 180,105 Q185,100 180,90 Q175,80 165,75 Q155,75 150,80 Q145,85 145,90" fill="#E53935"/>
                                <path d="M175,102 Q178,100 176,95" stroke="#C62828" stroke-width="2" fill="none"/>
                            </g>
                        </g>
                        
                        <!-- 触须/天线 -->
                        <g class="lobster-antennas" id="lobsterAntennas">
                            <path class="antenna-left" d="M170,50 Q180,30 190,20" stroke="#C62828" stroke-width="2" fill="none" stroke-linecap="round"/>
                            <path class="antenna-right" d="M175,50 Q185,25 195,15" stroke="#C62828" stroke-width="2" fill="none" stroke-linecap="round"/>
                        </g>
                        
                        <!-- 腿 -->
                        <g class="lobster-legs" id="lobsterLegs">
                            <path class="leg" d="M70,95 Q65,105 60,115" stroke="#C62828" stroke-width="3" fill="none"/>
                            <path class="leg" d="M85,100 Q80,112 75,122" stroke="#C62828" stroke-width="3" fill="none"/>
                            <path class="leg" d="M100,102 Q95,115 90,125" stroke="#C62828" stroke-width="3" fill="none"/>
                            <path class="leg" d="M115,100 Q110,112 105,122" stroke="#C62828" stroke-width="3" fill="none"/>
                            <path class="leg" d="M130,95 Q125,105 120,115" stroke="#C62828" stroke-width="3" fill="none"/>
                        </g>
                    </svg>
                    
                    <!-- 气泡效果 -->
                    <div class="bubbles" id="bubbles"></div>
                </div>
            </div>
            
            <!-- 当前播放歌词高亮 -->
            <div class="current-lyric" id="currentLyric"></div>
        </div>
        
        <!-- 控制面板 -->
        <div class="controls">
            <div class="control-group">
                <label class="control-label">上传歌曲</label>
                <input type="file" id="audioFile" accept="audio/*" class="file-input">
                <label for="audioFile" class="file-label">选择音频文件</label>
            </div>
            
            <div class="control-group">
                <label class="control-label">上传歌词 (LRC格式)</label>
                <input type="file" id="lyricsFile" accept=".lrc,.txt" class="file-input">
                <label for="lyricsFile" class="file-label">选择歌词文件</label>
            </div>
            
            <div class="control-group">
                <label class="control-label">上传克隆后歌曲</label>
                <input type="file" id="clonedAudioFile" accept="audio/*" class="file-input">
                <label for="clonedAudioFile" class="file-label">选择克隆音频</label>
            </div>
            
            <div class="player-controls">
                <button class="btn btn-primary" id="playBtn" disabled>
                    <span class="icon">▶</span>
                    <span class="text">播放</span>
                </button>
                <button class="btn btn-secondary" id="pauseBtn" disabled>
                    <span class="icon">⏸</span>
                    <span class="text">暂停</span>
                </button>
                <button class="btn btn-secondary" id="stopBtn" disabled>
                    <span class="icon">⏹</span>
                    <span class="text">停止</span>
                </button>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span>/</span>
                    <span id="totalTime">0:00</span>
                </div>
            </div>
            
            <div class="volume-control">
                <span class="volume-icon">🔊</span>
                <input type="range" id="volumeSlider" min="0" max="100" value="80" class="volume-slider">
            </div>
        </div>
        
        <!-- 音频播放器 -->
        <audio id="audioPlayer" preload="auto"></audio>
        <audio id="clonedAudioPlayer" preload="auto"></audio>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
